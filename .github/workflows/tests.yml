name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    name: Python tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt
      - name: Install model-free test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Run backend unit and API component tests
        run: python -m pytest --cov=backend --cov-branch --cov-report=term-missing --cov-report=xml:coverage/backend.xml --junitxml=test-results/backend.xml
      - name: Upload backend reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: backend-tests-${{ matrix.os }}
          path: |
            coverage/backend.xml
            test-results/backend.xml
          retention-days: 14

  frontend:
    name: Vue unit and component tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Enable pinned Yarn
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
      - run: yarn install --frozen-lockfile
      - name: Run frontend tests with coverage
        run: yarn test:unit:coverage --reporter=default --reporter=junit --outputFile.junit=test-results/frontend.xml
      - name: Check production frontend build
        run: yarn build
      - name: Upload frontend reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: frontend-tests
          path: |
            coverage/frontend/
            test-results/frontend.xml
          retention-days: 14

  rust:
    name: Rust tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Run Tauri library unit tests (no application launch)
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
