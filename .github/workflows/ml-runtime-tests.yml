name: ML runtime tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  runtimes:
    name: Real ML workflow (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.4"
      - name: Install all three production runtimes
        run: python scripts/setup_backend.py
      - name: Inventory and audit installed dependencies (advisory)
        id: audit
        continue-on-error: true
        run: python scripts/audit_runtimes.py
      - name: Add the locked test driver to the API environment
        run: python scripts/setup_backend.py --role backend --dev
      - name: Import packages and run real CPU inference
        run: node scripts/test_ml_runtimes.mjs
      - name: Upload ML results and source workflow log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ml-tests-${{ matrix.os }}
          path: |
            test-results/ml/
            test-results/dependencies/
          if-no-files-found: warn
          retention-days: 14
