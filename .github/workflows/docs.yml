name: Docs

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify generated docs and site build
    runs-on: ubuntu-latest
    env:
      UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.venvs/backend
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install locked frontend documentation parsers
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn install --frozen-lockfile
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.4"
      - name: Install locked API and documentation tools
        run: python scripts/setup_backend.py --role backend --docs
      - name: Regenerate derived docs
        run: uv run --project requirements/backend --no-sync python scripts/generate_docs.py
      - name: Ensure generated docs are committed
        run: git diff --exit-code docs/generated
      - name: Test source reference discovery and extraction
        run: |
          node --test scripts/tests/docs.test.mjs
          python -m unittest discover -s scripts/tests -p "test_docs.py"
      - name: Build docs site
        run: uv run --project requirements/backend --no-sync mkdocs build --strict

  deploy:
    name: Deploy docs site
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    env:
      UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.venvs/backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install locked frontend documentation parsers
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn install --frozen-lockfile
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.4"
      - name: Install locked API and documentation tools
        run: python scripts/setup_backend.py --role backend --docs
      - name: Regenerate derived docs
        run: uv run --project requirements/backend --no-sync python scripts/generate_docs.py
      - name: Build docs site
        run: uv run --project requirements/backend --no-sync mkdocs build --strict
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
