name: Build Unsigned Desktop Artifacts

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  tests:
    name: Release test gate
    uses: ./.github/workflows/tests.yml

  build-macos:
    name: Build macOS (app + dmg)
    needs: tests
    runs-on: macos-26
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: yarn

      - name: Enable Corepack and pin Yarn
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn --version

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10.11"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> src-tauri/target

      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile

      - name: Create isolated runtime environments
        run: python scripts/setup_backend.py

      - name: Verify isolated dependencies
        run: yarn sidecar:preflight

      - name: Build and smoke-test all three runtimes
        run: yarn build:sidecar

      - name: Package, verify, and smoke-test copied macOS app
        run: node scripts/package_desktop.mjs darwin

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v5
        with:
          name: mimir-macos-unsigned
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app.zip
          if-no-files-found: error

  build-windows:
    name: Build Windows (nsis)
    needs: tests
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: yarn

      - name: Enable Corepack and pin Yarn
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn --version

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10.11"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> src-tauri/target

      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile

      - name: Create isolated runtime environments
        run: python scripts/setup_backend.py

      - name: Verify isolated dependencies
        run: yarn sidecar:preflight

      - name: Build and smoke-test all three runtimes
        run: yarn build:sidecar

      - name: Build unsigned Windows installer
        run: node scripts/package_desktop.mjs win32

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v5
        with:
          name: mimir-windows-unsigned
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  publish-release-macos:
    name: Publish macOS Release Assets
    runs-on: ubuntu-latest
    needs: build-macos
    if: startsWith(github.ref, 'refs/tags/v') && needs.build-macos.result == 'success'
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Download macOS artifacts
        uses: actions/download-artifact@v5
        with:
          name: mimir-macos-unsigned
          path: release-assets/macos

      - name: Inspect macOS release payload
        run: |
          set -euo pipefail
          echo "macOS files to upload:"
          find release-assets/macos -maxdepth 3 -type f | sort

      - name: Prepare release notes
        run: |
          cat > release-notes.txt << 'EOF'
          Unsigned build artifacts are attached to this release.

          Expected first-run behavior:
          - macOS may show Gatekeeper warnings for unsigned apps.
          - Windows may show SmartScreen warnings for unsigned binaries.
          EOF

      - name: Ensure release exists and update notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file release-notes.txt
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.txt
          fi

      - name: Publish macOS assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(
            release-assets/macos/macos/*.app.zip
            release-assets/macos/dmg/*.dmg
          )

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No macOS release files found to upload." >&2
            exit 1
          fi

          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber

  publish-release-windows:
    name: Publish Windows Release Assets
    runs-on: ubuntu-latest
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/v') && needs.build-windows.result == 'success'
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v5
        with:
          name: mimir-windows-unsigned
          path: release-assets/windows

      - name: Inspect Windows release payload
        run: |
          set -euo pipefail
          echo "Windows files to upload:"
          find release-assets/windows -maxdepth 3 -type f | sort

      - name: Prepare release notes
        run: |
          cat > release-notes.txt << 'EOF'
          Unsigned build artifacts are attached to this release.

          Expected first-run behavior:
          - macOS may show Gatekeeper warnings for unsigned apps.
          - Windows may show SmartScreen warnings for unsigned binaries.
          EOF

      - name: Ensure release exists and update notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file release-notes.txt
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.txt
          fi

      - name: Publish Windows assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          files=(release-assets/windows/**/*.exe)

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No Windows release files found to upload." >&2
            exit 1
          fi

          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
