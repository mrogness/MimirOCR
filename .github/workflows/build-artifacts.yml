name: Build Unsigned Desktop Artifacts

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-macos:
    name: Build macOS (app + dmg)
    runs-on: macos-26
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: yarn

      - name: Enable Corepack and pin Yarn
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn --version

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10.11"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> src-tauri/target

      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile

      - name: Create venv and install backend packaging dependencies
        run: |
          python -m venv .venv
          ./.venv/bin/python -m pip install --upgrade pip
          ./.venv/bin/python -m pip install -r requirements-sidecar.txt
          ./.venv/bin/python -m pip install pyinstaller==6.21.0

      - name: Verify sidecar Python imports
        run: |
          ./.venv/bin/python -c "import kraken, calamari_ocr, uvicorn; print('python sidecar deps ok')"

      - name: Build macOS sidecar
        env:
          MIMIR_PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: |
          yarn sidecar:preflight
          yarn build:sidecar

      - name: Build unsigned macOS artifacts
        run: |
          yarn tauri build --bundles app

      - name: Replace duplicate TensorFlow library with symlink
        run: |
          set -euo pipefail

          APP_DIR="$(find src-tauri/target/release/bundle/macos \
            -maxdepth 1 -type d -name '*.app' | head -n 1)"

          INTERNAL="$APP_DIR/Contents/Resources/backend-runtime/_internal"

          rm -f "$INTERNAL/_pywrap_tensorflow_internal.so"

          ln -s \
            "tensorflow/python/_pywrap_tensorflow_internal.so" \
            "$INTERNAL/_pywrap_tensorflow_internal.so"

          test -L "$INTERNAL/_pywrap_tensorflow_internal.so"
          test -e "$INTERNAL/_pywrap_tensorflow_internal.so"

          ls -l "$INTERNAL/_pywrap_tensorflow_internal.so"

      - name: Re-sign patched macOS app
        run: |
          set -euo pipefail

          APP_DIR="$(find src-tauri/target/release/bundle/macos \
            -maxdepth 1 \
            -type d \
            -name '*.app' \
            | head -n 1)"

          if [ -z "$APP_DIR" ]; then
            echo "No app bundle found" >&2
            exit 1
          fi

          # Remove extended attributes that can interfere with signing.
          xattr -cr "$APP_DIR"

          # Apply a fresh ad-hoc signature to the modified bundle.
          codesign \
            --force \
            --deep \
            --sign - \
            "$APP_DIR"

          codesign --verify --deep --strict --verbose=4 "$APP_DIR"

      - name: Zip patched macOS app
        run: |
          node scripts/zip_macos_app_bundle.mjs
        
      - name: Create DMG from patched app
        run: |
          set -euo pipefail

          APP_DIR="$(find src-tauri/target/release/bundle/macos \
            -maxdepth 1 \
            -type d \
            -name '*.app' \
            | head -n 1)"

          if [ -z "$APP_DIR" ]; then
            echo "No .app bundle found" >&2
            exit 1
          fi

          APP_NAME="$(basename "$APP_DIR")"
          DMG_DIR="src-tauri/target/release/bundle/dmg"
          DMG_PATH="$DMG_DIR/MimirOCR.dmg"

          rm -rf "$DMG_DIR"
          mkdir -p "$DMG_DIR"

          STAGING_DIR="$(mktemp -d)"

          cleanup() {
            rm -rf "$STAGING_DIR"
          }

          trap cleanup EXIT

          # Preserve the symlink inside the app bundle.
          ditto "$APP_DIR" "$STAGING_DIR/$APP_NAME"

          # Add the standard Applications shortcut.
          ln -s /Applications "$STAGING_DIR/Applications"

          hdiutil create \
            -volname "MimirOCR" \
            -srcfolder "$STAGING_DIR" \
            -format UDZO \
            -ov \
            "$DMG_PATH"

          echo "Created DMG:"
          ls -lh "$DMG_PATH"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v5
        with:
          name: mimir-macos-unsigned
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app.zip
          if-no-files-found: error

  build-windows:
    name: Build Windows (nsis)
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: yarn

      - name: Enable Corepack and pin Yarn
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn --version

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10.11"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> src-tauri/target

      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile

      - name: Create venv and install backend packaging dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.venv\Scripts\python.exe -m pip install -r requirements-sidecar.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.venv\Scripts\python.exe -m pip install kraken==4.3.13
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.venv\Scripts\python.exe -m pip install pyinstaller==6.21.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Debug installed sidecar packages
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe -m pip show kraken
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.venv\Scripts\python.exe -m pip show calamari-ocr
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Windows sidecar
        shell: pwsh
        env:
          MIMIR_PYTHON: ${{ github.workspace }}/.venv/Scripts/python.exe
        run: |
          yarn sidecar:preflight
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          yarn build:sidecar
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build unsigned Windows installer
        shell: pwsh
        run: |
          yarn tauri build --bundles nsis

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v5
        with:
          name: mimir-windows-unsigned
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  publish-release-macos:
    name: Publish macOS Release Assets
    runs-on: ubuntu-latest
    needs: build-macos
    if: startsWith(github.ref, 'refs/tags/v') && needs.build-macos.result == 'success'
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Download macOS artifacts
        uses: actions/download-artifact@v5
        with:
          name: mimir-macos-unsigned
          path: release-assets/macos

      - name: Inspect macOS release payload
        run: |
          set -euo pipefail
          echo "macOS files to upload:"
          find release-assets/macos -maxdepth 3 -type f | sort

      - name: Prepare release notes
        run: |
          cat > release-notes.txt << 'EOF'
          Unsigned build artifacts are attached to this release.

          Expected first-run behavior:
          - macOS may show Gatekeeper warnings for unsigned apps.
          - Windows may show SmartScreen warnings for unsigned binaries.
          EOF

      - name: Ensure release exists and update notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file release-notes.txt
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.txt
          fi

      - name: Publish macOS assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(
            release-assets/macos/macos/*.app.zip
            release-assets/macos/dmg/*.dmg
          )

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No macOS release files found to upload." >&2
            exit 1
          fi

          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber

  publish-release-windows:
    name: Publish Windows Release Assets
    runs-on: ubuntu-latest
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/v') && needs.build-windows.result == 'success'
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v5
        with:
          name: mimir-windows-unsigned
          path: release-assets/windows

      - name: Inspect Windows release payload
        run: |
          set -euo pipefail
          echo "Windows files to upload:"
          find release-assets/windows -maxdepth 3 -type f | sort

      - name: Prepare release notes
        run: |
          cat > release-notes.txt << 'EOF'
          Unsigned build artifacts are attached to this release.

          Expected first-run behavior:
          - macOS may show Gatekeeper warnings for unsigned apps.
          - Windows may show SmartScreen warnings for unsigned binaries.
          EOF

      - name: Ensure release exists and update notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file release-notes.txt
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.txt
          fi

      - name: Publish Windows assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          files=(release-assets/windows/**/*.exe)

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No Windows release files found to upload." >&2
            exit 1
          fi

          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
