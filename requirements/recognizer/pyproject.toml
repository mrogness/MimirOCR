[project]
name = "mimirocr-recognizer-environment"
version = "0.0.0"
requires-python = "==3.10.*"
dependencies = [
  "calamari_ocr==2.3.1",
  "tensorflow==2.15.1",
  # TensorFlow's Windows wheel is a wrapper; lock the implementation explicitly.
  "tensorflow-intel==2.15.1; sys_platform == 'win32'",
  "tensorflow-estimator==2.15.0",
  "keras==2.15.0",
  "pydantic==2.14.2",
  "numpy==1.23.5",
  "pillow==12.3.0",
  "protobuf==3.20.3",
  # TensorBoard 2.15 still uses pkg_resources, removed in setuptools 82.
  "setuptools<82",
]

[dependency-groups]
build = ["pyinstaller==6.21.0", "pyinstaller-hooks-contrib==2026.6"]

[tool.uv]
package = false
default-groups = []
environments = [
  "sys_platform == 'darwin'",
  "sys_platform == 'win32'",
]
