[project]
name = "mimirocr-backend-environment"
version = "0.0.0"
requires-python = "==3.11.*"
dependencies = [
  "fastapi==0.139.2",
  "uvicorn==0.54.0",
  "SQLAlchemy==2.0.51",
  "pydantic==2.13.4",
  "python-multipart==0.0.32",
  "pillow==13.0.0",
  "pymupdf==1.28.2",
  "reportlab==5.0.0",
]

[dependency-groups]
build = ["pyinstaller==6.21.0", "pyinstaller-hooks-contrib==2026.6"]
test = ["pytest==8.4.2", "pytest-cov==6.2.1", "httpx==0.28.1"]
docs = ["mkdocs==1.6.1", "mkdocs-material==9.6.20", "pymdown-extensions==10.16.1"]

[tool.uv]
package = false
default-groups = []
environments = [
  "sys_platform == 'darwin'",
  "sys_platform == 'win32'",
  "sys_platform == 'linux'",
]
