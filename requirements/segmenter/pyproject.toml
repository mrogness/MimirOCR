[project]
name = "mimirocr-segmenter-environment"
version = "0.0.0"
requires-python = "==3.11.*"
dependencies = [
  "kraken",
  "torch==2.10.0",
  "torchvision==0.25.0",
  "coremltools==9.0",
  "pydantic==2.13.4",
  "numpy==2.2.6",
  "pillow==13.0.0",
  "pytorch-lightning==2.6.6"
]

[dependency-groups]
build = ["pyinstaller==6.21.0", "pyinstaller-hooks-contrib==2026.6"]

[tool.uv]
package = false
default-groups = []
environments = [
  "sys_platform == 'darwin'",
  "sys_platform == 'win32'",
]

[tool.uv.sources]
# Upstream updates the lightning distribution to 2.6.6 for GHSA-qqmf-gpg7-g8gw.
kraken = { git = "https://github.com/mittagessen/kraken.git", rev = "910e55ee317dd3bc6e944e23456306e0ec7d3291" }
